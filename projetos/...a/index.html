<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Termo</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="jmHeader">
        <img src="./assets/among-02.png" alt="">
        <div class="jmTentativas">
            <h3>TENTATIVAS</h3>
            <h1 class="jmH1"><span class="jmGreen">0</span>/6</h1>
        </div>
        <p class="jmPheader">Adivinhe a palavra secreta de 5 letras.</p>
    </header>

    <main class="jmMain">
        <div class="jmTermo">
            <input class="jmInput" type="text" placeholder="Acerte a senha" maxlength="5" />
            <button class="jmBtnEnviar">ENVIAR</button>
        </div>
    </main>

    <!-- Modal de Vitória -->
    <div class="modal modal-vitoria" id="modalVitoria">
        <div class="container">
            <a href="#" class="btnFechar">❌</a>
            <h1>🎉 PARABÉNS!</h1>
            <p>Você acertou a palavra secreta!</p>
        </div>
    </div>

    <!-- Modal de Derrota -->
    <div class="modal modal-derrota" id="modalDerrota">
        <div class="container">
            <a href="#" class="btnFechar">❌</a>
            <h1>😢 QUE PENA!</h1>
            <p>Acabaram as tentativas.</p>
            <p>A palavra era: <strong id="palavraRevelada"></strong></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
